<style>:root{color-scheme:light;--bg:#f7f6f0;--paper:#fffefa;--ink:#1d302b;--muted:#52645b;--line:#cdd7ce;--green:#174c3b;--tint:#e7efe6;--rust:#864825;--warm:#f8edde;--serif:"Songti SC","STSong","Noto Serif CJK SC",Georgia,serif;--sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;font-family:var(--sans);color:var(--ink);background:var(--bg);line-height:1.65}*{box-sizing:border-box}body{margin:0}button,a,textarea,input{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer;color:inherit}a{color:var(--green)}button:focus-visible,a:focus-visible,summary:focus-visible,textarea:focus-visible{outline:3px solid #cb792e;outline-offset:3px}.mast{border-bottom:1px solid var(--line);background:var(--paper)}.mast-in{max-width:1020px;padding:13px 28px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.mast a{text-decoration:none}.mast-in>a:first-child{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:20px;font-weight:700;letter-spacing:.03em}.emblem{height:30px;width:29px;border-radius:4px;background:var(--green);color:white;display:grid;place-items:center;font:24px/1 Georgia}.catalog{font-size:13px}.mast a,.breadcrumb a,summary{min-height:36px;display:inline-flex;align-items:center}main{max-width:1020px;margin:auto;padding:36px 28px 72px}h1,h2,h3,p{margin:0}h1,h2{font-family:var(--serif);line-height:1.26}h1{font-size:clamp(32px,5vw,52px);letter-spacing:-.04em}h2{font-size:clamp(23px,3.2vw,30px)}h3{font-size:18px;line-height:1.5}.intro{max-width:740px;color:var(--muted);margin-top:12px}.book-grid{display:grid;grid-template-columns:1.08fr 1fr;gap:24px;margin:30px 0 18px}.shelf{border-top:4px solid var(--green);background:var(--paper);border-radius:3px 3px 10px 10px;padding:22px;box-shadow:0 1px 2px #152e2411}.shelf.manage{border-color:var(--rust)}.shelf p,.sub,.foot,.help{font-size:14px;color:var(--muted)}.shelf p{margin:5px 0 17px}.book-link,.mode{display:flex;align-items:center;width:100%;text-align:left;gap:14px;background:transparent;border:0;border-top:1px solid var(--line);padding:14px 1px;text-decoration:none;color:var(--ink)}.book-link:hover,.mode:hover{background:#eff3eb}.book-id{font:italic 31px Georgia,serif;color:var(--green);min-width:32px;text-align:center}.manage .book-id{color:var(--rust)}.details-col{flex:1;min-width:0}.details-col strong,.details-col small{display:block}.details-col small{font-size:13px;color:var(--muted)}.arrow{font-size:22px;color:var(--muted)}.foot,.help{line-height:1.7}.breadcrumb{font-size:14px;color:var(--muted);margin-bottom:14px}.breadcrumb a{text-decoration:none}.paper,.panel{padding:clamp(16px,3vw,30px);background:var(--paper);border:1px solid var(--line);border-radius:10px}.paper{margin-top:15px}.narrow{max-width:800px;margin:auto}.modes{margin:24px 0 12px}.mode{font-size:16px}.mode .marker{width:46px;text-align:center;color:var(--green);font:italic 23px Georgia,serif}.mode .badge,.ts{font-size:13px;color:var(--muted)}.pbtn,.btn{border-radius:6px;padding:9px 16px;min-height:44px;font-weight:600;display:inline-flex;justify-content:center;align-items:center;gap:7px;text-decoration:none}.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink)}.pbtn{background:var(--green);color:white;border:1px solid var(--green)}.btn:hover{background:var(--tint)}.pbtn:hover{background:#0e392b}.btn:disabled,.pbtn:disabled{opacity:.55;cursor:default}.danger{color:#803a26}.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px}.actions.end{justify-content:space-between}.sbar{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#f7f6f0f5;border-bottom:1px solid var(--line);padding:8px 0;flex-wrap:wrap}.sbar strong{display:block}.timerbox{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.timer{font:600 18px/1.4 ui-monospace,monospace;font-variant-numeric:tabular-nums}.timer.warn{color:#a53c19}.timegrp small{display:block;color:var(--muted);font-size:11px;line-height:1.4}.strip{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--muted);font-size:14px}.track{height:4px;background:var(--line);margin:10px 0 16px;border-radius:2px}.track i{display:block;height:100%;background:var(--green)}.context{line-height:1.85;margin:12px 0 14px;color:#35463e}.qtitle{font:650 clamp(19px,3vw,23px)/1.55 var(--sans);margin:12px 0}.opts{display:grid;gap:8px;margin-top:16px}.opt{display:flex;width:100%;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:white;border-radius:7px;padding:11px 14px;min-height:48px}.opt[aria-pressed=true]{border:2px solid var(--green);padding:10px 13px;background:var(--tint)}.letter{font:bold 14px ui-monospace,monospace;color:var(--muted)}.opt.fig{justify-content:flex-start}.opts.figopts{grid-template-columns:repeat(4,minmax(0,1fr))}.figopts .opt{padding:5px;gap:1px}.figopts .opt[aria-pressed=true]{padding:4px}.figopts svg{width:68px;max-width:80%;height:auto}.graph{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:4px;background:#f0f3eb;padding:8px;border-radius:7px;width:min(100%,calc(var(--cols)*88px + 16px));margin:12px auto}.tile{display:flex;align-items:center;justify-content:center;min-width:0;background:var(--paper);border-radius:3px}.tile svg{width:100%;max-width:80px;height:auto;display:block}.tile.net svg{max-width:190px}.graph.net{width:min(100%,210px)}.qmark{font:italic 31px var(--serif);color:var(--green)}table{border-collapse:collapse;width:100%;font-size:14px;margin:13px 0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}td,th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}th{background:var(--tint);color:var(--green)}textarea{display:block;width:100%;min-height:220px;padding:13px;border-radius:6px;border:1px solid #9aaca1;background:white;resize:vertical;font-size:16px;line-height:1.7;color:var(--ink)}.wcount{text-align:right;color:var(--muted);font-size:13px}.wcount.over{color:#9a311d}.notice{padding:10px 14px;background:var(--warm);border-radius:5px;margin:10px 0;color:#69401d}.review-row{display:block;background:var(--paper);border-bottom:1px solid var(--line);padding:9px 4px}.review-row summary{display:list-item;cursor:pointer;font-weight:600;min-height:40px;padding:7px 0}.review-row p,.review-row ul,.review-row table{margin:8px 0}.review-row ul{padding-left:23px}.review-body{padding:4px 12px 16px}.review-body .help{margin-top:12px}.wa{color:#94472c}.ok{color:var(--green)}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.filters [aria-pressed=true]{background:var(--green);color:white}.cell-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}.cell-list span{background:var(--tint);padding:3px 10px;border-radius:4px;font-size:14px}.check{display:flex;gap:8px;align-items:flex-start;padding:7px 0}.check input{margin-top:7px}.preserve{white-space:pre-wrap;overflow-wrap:anywhere}.passage{background:#f0f3eb;padding:13px;border-radius:5px}.session-head{font-size:14px}.savedraft{font-size:13px;color:var(--muted)}#storage-warning{position:sticky;bottom:0;background:var(--warm);color:#502b16;padding:6px 12px}.pausebox{margin:25px auto}.pausebox h2{margin-bottom:8px}.muted{color:var(--muted)}button,summary,label{ -webkit-tap-highlight-color:transparent }@media(max-width:650px){main{padding:20px 13px 50px}.mast-in{padding:7px 14px}.book-grid{grid-template-columns:1fr;gap:16px;margin:20px 0}.shelf{padding:16px}.book-link{padding:11px 0}.paper,.panel{padding:15px}.timegrp small{font-size:11px}.sbar{align-items:center}.sbar .btn{padding:5px 10px}.timerbox{gap:6px}.sbar .session-head{max-width:95px;font-size:13px}.figopts .opt{flex-direction:column;align-items:center}.figopts svg{max-width:100%}.figopts .letter{align-self:flex-start}.actions{gap:6px}.opts{gap:7px}td,th{padding:6px 4px}.mode{gap:8px}.mode .marker{width:36px}.timer{font-size:16px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

.export-entry{display:flex;gap:18px;align-items:center;justify-content:space-between;margin:20px 0}.export-entry h2{font-size:24px}.export-entry .pbtn{flex-shrink:0}.question-tools{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:16px}.mark-btn{font-size:14px}.mark-btn[aria-pressed=true]{background:var(--warm);border-color:#b99b6e}.export-panel{margin:20px 0}.export-panel .help{margin-top:12px}.export-tip{margin:18px 0}.export-item{margin:14px 0;border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--paper)}.export-item .review-row{border:0}.export-check{font-weight:600}.export-check small{display:block;font-weight:400;font-size:13px;color:var(--muted)}.export-check input{width:20px;height:20px;flex-shrink:0}.export-item .review-body{padding:4px 0 10px}.focus-note{padding:10px 0}#export-text{margin-top:12px;min-height:180px}#export-text[hidden]{display:none}.passage{margin-top:16px}@media(max-width:650px){.export-entry{display:block}.export-entry .pbtn{margin-top:12px}.export-panel .actions{align-items:stretch}.export-panel .actions button{flex:1 1 auto}.question-tools{gap:7px}.question-tools .help{font-size:13px}}

<script>const BANK={"c-a":{"v":[{"context":"一次服务改版允许客户自助取消订单。上线首月，电话咨询少了三成，但有更多用户在帮助页反复搜索“退款进度”。运营认为客服负担已经下降。","prompt":"最稳妥的判断是哪项？","why":"电话量只覆盖一个渠道。搜索增加提示负担可能转移，材料没有给出总工时、订单量或退款时长。","id":"Av01","section":"v","limit":60,"opts":["搜索量上升，表明用户实际等退款的时间更长","帮助页承接了原来的咨询，因此用户更快获得答复","电话需求下降，整体求助成本还需核实","咨询次数下降三成，可以据此同步缩减三成排班"],"correct":2},{"context":"只有完成校准的传感器才能进入仓库。进入仓库的传感器中，有一部分还没有分配给产线。","prompt":"哪项一定成立？","why":"从那批“已入库但未分配”的设备出发，入库必然意味着已校准。反方向的推理没有依据。","id":"Av02","section":"v","limit":75,"opts":["凡是校准过的传感器都已入库","未分配给产线的传感器都在仓库","已分配给产线的传感器都曾在仓库","有些已经校准的传感器还没有分配给产线"],"correct":3},{"context":"市图书馆延长晚间开放后，夜间进馆人数增加。馆方据此推测，新安排让原本无法到馆的读者也能使用服务。","prompt":"哪条新增证据最能支持馆方的解释？","why":"该解释关注新增人群及其原有障碍。“新读者多数此前受下班时间限制无法到馆”同时对两者提供证据；原有读者换时段反而是竞争性解释。","id":"Av03","section":"v","limit":90,"opts":["晚间新增座位利用率超过原有座位，持续三周","原有读者中，有较高比例更喜欢晚间借阅","周末的借阅量也随之上升，且读者评价良好","新读者多数此前受下班时间限制无法到馆"],"correct":3},{"context":"一个工作组把复盘会上的发言次数用作协作指标。几个月后，发言更频繁了，但关键分歧仍留在会后解决。组长决定同时记录哪些分歧在会上得到澄清。","prompt":"组长调整记录方式主要想解决什么问题？","why":"记录分歧是否澄清，是给频次增加结果证据。材料没有主张取消会后协作，也没有证明频繁发言有害。","id":"Av04","section":"v","limit":60,"opts":["用新的记录方式估算缩短会议能节省多少工时","降低发言频次，给沉默成员更多贡献机会","区分参与讨论和解决分歧","判断哪些分歧应从会议中移交给书面流程"],"correct":2},{"context":"甲、乙两个版本同时受测，用户可自行选择版本。甲的满意度更高。研究者认为甲的界面能提升所有用户的满意度。","prompt":"下列哪项最削弱这个结论？","why":"自选版本导致用户起点不同，组间满意度差异未必由界面引起；“所有用户”更缺少支持。","id":"Av05","section":"v","limit":75,"opts":["参与者先试用一天再填问卷，两版流程相同","老用户原本更满意，且大多主动选甲","两个版本的平均使用时间相同，样本量略有不同","许多选甲的人在开放意见里提到界面清晰"],"correct":1},{"context":"三个展位从左到右排成一行，分别是陶瓷、织物、木作。木作不在最右边，陶瓷紧挨在木作的右边。","prompt":"哪项一定为真？","why":"可能的次序有木陶织、织木陶。两种次序中陶瓷左边都有木作，其他说法各有反例。","id":"Av06","section":"v","limit":90,"opts":["陶瓷不在最左边","织物一定在最右边","木作一定在最左边","织物一定挨着木作"],"correct":0},{"context":"一项调查发现，更多骑行者选择有树荫的长路线。作者推测，在夏日中午，遮阴带来的舒适比少走几百米更重要。","prompt":"哪项最符合作者推测的适用范围？","why":"作者限定了时间、交通方式和小幅距离差异。观察到的选择不能扩展为全年、全城或普遍偏好。","id":"Av07","section":"v","limit":60,"opts":["增加树荫是全年改善骑行通勤效率的最佳投资","夏日中午，树荫可能值得多骑一小段","只要骑行时间不变，多数人会改用最长路线","夏天选择短路线的人更重视速度而非沿途舒适"],"correct":1},{"context":"旧流程要求所有申请走同一审批链。新流程让低风险申请直接通过，把专家时间集中到高风险申请上。改革要在缩短等待的同时维持审查质量。","prompt":"上述改革最依赖哪项前提？","why":"如果无法在入口识别风险，分流会把重要申请直接放过。类别数量、专家速度相同和零错误都不是必要条件。","id":"Av08","section":"v","limit":75,"opts":["入口能可靠识别申请风险","低风险申请中，每一笔都具备完全相同的材料","高风险申请应在数量上超过低风险申请的一半","分流前后，每位专家的平均处理速度都能保持相同"],"correct":0},{"context":"社区服务站把预约入口从一个增加到三个。预约记录数变多，但同一个人可以从不同入口重复预约。","prompt":"若要判断服务覆盖是否扩大，应优先比较什么？","why":"覆盖问的是不同的人是否实际获得服务，去重且看履约是关键。记录、提醒和速度回答的是别的问题。","id":"Av09","section":"v","limit":90,"opts":["按相同口径去重后的实际服务人数","三个入口各自收到的预约记录总和","当月发布的预约提醒数量","最快入口的平均提交时间"],"correct":0},{"context":"初稿说：“试点让全部门的差错率下降。”已知只有两个自愿参加的小组，开展前后对比，未设对照组。","prompt":"怎样改写最符合证据？","why":"前后数据支持描述变化，不足以单独识别原因。不能把两个自愿组的表现直接外推到整个部门。","id":"Av10","section":"v","limit":60,"opts":["试点已证明这两个小组因流程而改善，只是样本不足以外推","两组差错率随后下降，原因尚待检验","两组在试点期间表现一致，可以据此估计部门平均效果","考虑到没有对照组，应把下降仅归因于人员能力提高"],"correct":1}],"d":[{"context":"两条生产线同周抽检，每件产品只检查一次。","table":[["产线","抽检件数","合格率"],["甲","200","96%"],["乙","800","91%"]],"prompt":"两条线合并后的合格率是多少？","why":"(200×96%＋800×91%) ÷ 1,000 = 920 ÷ 1,000 = 92%。按抽检件数加权。","id":"Ad01","section":"d","limit":75,"opts":["93.5%","92%","91.5%","94%"],"correct":1},{"context":"订阅产品按季度统计，收入单位为万元。","table":[["指标","上季","本季"],["付费人数","2,000","2,400"],["总收入","80","90"]],"prompt":"本季每名付费用户平均收入比上季怎样变化？","why":"上季每人 400 元，本季 375 元。变化率为 (375−400) ÷ 400 = −6.25%。","id":"Ad02","section":"d","limit":90,"opts":["下降 6.25%","上升 6.25%","下降 7.5%","上升 12.5%"],"correct":0},{"context":"同一批访问依次经过三个环节，无重复用户。","table":[["环节","数据"],["到达页面","80,000 人"],["到达后注册","15%"],["注册后试用","25%"],["试用后付费","12%"]],"prompt":"最终有多少人付费？","why":"80,000 × 15% × 25% × 12% = 360。每一步的分母都是上一环节。","id":"Ad03","section":"d","limit":60,"opts":["360 人","3,000 人","1,440 人","288 人"],"correct":0},{"context":"甲乙两城的日订单如下。","table":[["城市","周一","周二"],["甲","1,200","1,380"],["乙","800","820"]],"prompt":"两城合计净增的订单中，甲贡献了多少？","why":"甲净增 180，乙净增 20，总净增 200。贡献率 = 180 ÷ 200 = 90%。","id":"Ad04","section":"d","limit":75,"opts":["15%","62.7%","81.8%","90%"],"correct":3},{"context":"工厂一周有 5 个工作日，每人每天工作 8 小时。","table":[["项目","数值"],["人数","6 人"],["全部工作时间中可投入生产","75%"],["每件工时","1.5 小时"]],"prompt":"不加班、不计其他损耗，该周最多生产多少件？","why":"6 × 5 × 8 × 75% = 180 个有效工时，再除以 1.5，得 120 件。","id":"Ad05","section":"d","limit":90,"opts":["160 件","180 件","120 件","135 件"],"correct":2},{"context":"商店一批货共 1,000 件，均已售出。全部收入在扣除退货后确认。","table":[["项目","数据"],["每件售价","120 元"],["已全额退货","50 件"],["单件采购成本","72 元"]],"prompt":"只问扣除退款后的销售收入，金额是多少？","why":"净销售收入 = (1,000−50) × 120 = 114,000 元。采购成本影响利润，不影响此处收入。","id":"Ad06","section":"d","limit":60,"opts":["120,000 元","45,600 元","114,000 元","110,400 元"],"correct":2},{"context":"两组记录观察同样长的 7 天。","table":[["组别","收到邀请","完成首单"],["对照","2,000 人","180 人"],["试点","1,500 人","165 人"]],"prompt":"试点相对对照的首单率提高了多少个百分点？","why":"试点 165/1,500 = 11%，对照 180/2,000 = 9%，相减得 2 个百分点；相对提升才是约 22.2%。","id":"Ad07","section":"d","limit":75,"opts":["1.5 个百分点","0.2 个百分点","22.2 个百分点","2 个百分点"],"correct":3},{"context":"两个方案的包月费用及按件收费如下。","table":[["方案","固定费/月","每件服务费"],["甲","1,800 元","3 元"],["乙","600 元","7 元"]],"prompt":"当服务量为整数时，甲第一次严格比乙便宜是在多少件？","why":"1,800＋3x < 600＋7x，解得 x > 300。300 件时两者恰好相等，严格更便宜从 301 件起。","id":"Ad08","section":"d","limit":90,"opts":["301 件","299 件","300 件","401 件"],"correct":0},{"context":"某业务年初库存 480 件。次月末盘点前的收发均已记录。","table":[["月份","到货","发货"],["一月","220","310"],["二月","160","190"]],"prompt":"二月末库存可覆盖多少天？假设之后每天消耗 15 件。","why":"期末库存 480＋220−310＋160−190 = 360 件，360 ÷ 15 = 24 天。","id":"Ad09","section":"d","limit":60,"opts":["26 天","24 天","32 天","20 天"],"correct":1},{"context":"服务中心本周已处理工单，时长已按升序排列。","table":[["处理时长","工单数"],["1 天","4"],["2 天","7"],["3 天","6"],["4 天","3"]],"prompt":"这 20 单处理时长的中位数是多少？","why":"第 10、11 单都落在第 5～11 单的两天档，中位数是 2 天。","id":"Ad10","section":"d","limit":75,"opts":["3 天","2 天","2.4 天","2.5 天"],"correct":1}],"f":[{"prompt":"按照箭头变化的规律，问号处应是哪一个？","cols":5,"frames":[["arrow",0],["arrow",2],["arrow",4],["arrow",6],null],"why":"箭头每次顺时针转 90°：上、右、下、左，下一步回到上。","id":"Af01","section":"f","limit":75,"opts":[["arrow",3],["arrow",0],["arrow",2],["arrow",6]],"correct":1},{"prompt":"黑格沿着方框边缘移动，下一幅是什么？","cols":6,"frames":[["grid",3,"0"],["grid",3,"1"],["grid",3,"2"],["grid",3,"5"],["grid",3,"8"],null],"why":"黑格沿外圈顺时针每次前进一格。到达右下角后，下一格是下边中间。","id":"Af02","section":"f","limit":90,"opts":[["grid",3,"7"],["grid",3,"4"],["grid",3,"3"],["grid",3,"6"]],"correct":0},{"prompt":"观察每一行，补上第三行的最后一格。","cols":3,"frames":[["grid",3,"01"],["grid",3,"58"],["grid",3,"0158"],["grid",3,"36"],["grid",3,"24"],["grid",3,"2346"],["grid",3,"04"],["grid",3,"78"],null],"why":"同行第三幅保留前两幅的全部黑格。最后一行应保留左上、中心以及底行中间和右侧。","id":"Af03","section":"f","limit":60,"opts":[["grid",3,"48"],["grid",3,"078"],["grid",3,"02478"],["grid",3,"0478"]],"correct":3},{"prompt":"图形的形状与填充各有规律，选下一幅。","cols":5,"frames":[["poly",3,1],["poly",4,0],["poly",5,1],["poly",3,0],null],"why":"边数按 3、4、5 循环，实心和空心交替。第五幅是实心四边形。","id":"Af04","section":"f","limit":75,"opts":[["poly",4,1],["poly",5,0],["poly",4,0],["poly",3,1]],"correct":0},{"prompt":"按左右两端各自的变化，补全骨牌。","cols":5,"frames":[["dom",1,5],["dom",2,4],["dom",3,3],["dom",4,2],null],"why":"左端依次加 1，右端依次减 1，所以最后是左 5、右 1。","id":"Af05","section":"f","limit":90,"opts":[["dom",5,3],["dom",1,5],["dom",5,1],["dom",4,1]],"correct":2},{"prompt":"同一行左图如何变成右图？按相同变换补全。","cols":2,"frames":[["grid",3,"013"],["grid",3,"125"],["grid",3,"258"],["grid",3,"036"],["grid",3,"047"],null],"why":"沿竖直中线左右翻转。左上移到右上，中间列的中心和下中保持原位。","id":"Af06","section":"f","limit":60,"opts":[["grid",3,"037"],["grid",3,"245"],["grid",3,"247"],["grid",3,"146"]],"correct":2},{"prompt":"三条柱子的次序按固定方式改变，下一组是什么？","cols":5,"frames":[["bars",[1,2,3]],["bars",[2,3,1]],["bars",[3,1,2]],["bars",[1,2,3]],null],"why":"每次把最左柱移到最右，其余左移。由低、中、高变为中、高、低。","id":"Af07","section":"f","limit":75,"opts":[["bars",[2,3,1]],["bars",[3,2,1]],["bars",[3,1,2]],["bars",[1,3,2]]],"correct":0},{"prompt":"根据前两行示范，选出最后一幅。","cols":3,"frames":[["grid",3,"014"],["grid",3,"145"],["grid",3,"14"],["grid",3,"256"],["grid",3,"067"],["grid",3,"6"],["grid",3,"1378"],["grid",3,"4578"],null],"why":"第三幅只涂两图相同位置都黑的格子。末行共同点是底行中、右两格。","id":"Af08","section":"f","limit":90,"opts":[["grid",3,"18"],["grid",3,"78"],["grid",3,"45"],["grid",3,"134578"]],"correct":1},{"prompt":"圆盘上有指针和圆点，各走各的步数。接下来如何？","cols":5,"frames":[["dial",0,4],["dial",2,3],["dial",4,2],["dial",6,1],null],"why":"按八方位计，指针顺时针走两格，外圈圆点逆时针走一格，下一幅两者都指向正上。","id":"Af09","section":"f","limit":60,"opts":[["dial",0,2],["dial",0,0],["dial",4,0],["dial",6,4]],"correct":1},{"prompt":"每行都遵循同一种形状排列规律。问号处是什么？","cols":3,"frames":[["poly",3,1],["poly",4,1],["poly",0,1],["poly",4,1],["poly",0,1],["poly",3,1],["poly",0,1],["poly",3,1],null],"why":"每行由上一行向左循环移动一位。第三行是圆、三角、四边形。","id":"Af10","section":"f","limit":75,"opts":[["poly",3,1],["poly",0,1],["poly",5,1],["poly",4,1]],"correct":3}]},"c-b":{"v":[{"context":"两家门店都采用“畅销品优先补货”。一周后缺货投诉下降，但被登记为缺货的商品种类更多了。","prompt":"哪项最能同时解释这两个现象？","why":"投诉受每种商品的顾客人数影响，品种数则按品种计。少数畅销品和众多长尾品的变化可以方向相反。","id":"Bv01","section":"v","limit":60,"opts":["畅销品补货变快，因此全店缺货商品种类必然减少","畅销款恢复供应，更多冷门品种仍缺货","投诉量只由缺货的品种数决定，与需求人数无关","每款商品引起投诉的概率相同，只是热门商品价格更高"],"correct":1},{"context":"内部规则规定，只有完成演练且取得值班许可的人可以独立值班。小周完成了演练，但没有独立值班。","prompt":"仅据上述信息可以断定什么？","why":"规定的是独立值班的必要条件。有资格也可能尚未排班，由没有值班不能倒推出没有许可。","id":"Bv02","section":"v","limit":75,"opts":["小周一定没有取得值班许可","只要小周取得许可，就已经独立值过班","还不能确定小周是否取得值班许可","独立值班的人未必完成过演练"],"correct":2},{"context":"一支团队把每周新增意向客户作为目标。后来新增意向增长，签约却没增长。销售建议取消意向指标。运营则说要先看从首次接触到签约的时间。","prompt":"运营的关键考虑是什么？","why":"转化有滞后。应比较成熟程度相同的客户批次，才能区分低质量意向和签约尚未发生。","id":"Bv03","section":"v","limit":90,"opts":["各批客户只要按签约日期分组，就能直接比较线索质量","签约滞后说明新增意向足以替代签约量衡量销售绩效","新意向可能还没走完签约周期","签约所需时间越长，可以归功于本期团队的签约应该越多"],"correct":2},{"context":"一个团队在评估远程协作。负责人说：“我们收到的满意反馈几乎全来自远程办公者，所以远程办公者更满意。”","prompt":"要比较两种办公方式的满意比例，最缺什么？","why":"已知接近“满意反馈中谁多”。要比较“各组有多大比例满意”，须知道组内分母，还需防止非回应偏差。","id":"Bv04","section":"v","limit":60,"opts":["两种办公方式的总人数，以及远程员工的平均工龄","各组调查基数、满意人数及回应情况","每组最高满意度评分，以及给满分的人在公司任职多久","满意留言里不同岗位的人数，以及每人平均写了多少字"],"correct":1},{"context":"规则：若方案甲入选，乙也必须入选；乙、丙不能同时入选。本轮丙已入选。","prompt":"哪种结论必然成立？","why":"丙入选排除乙；若甲入选会强 普通用户的平均登录天数","比较可避免的预期损失及替代和维护成本"],"correct":3},{"context":"如果零件有隐裂且承受高压，测试灯一定亮。本次测试灯没亮，测试人员确认设备处于高压状态。","prompt":"在规则和设备正常的前提下，必然成立的是？","why":"有高压而没亮，排除“有隐裂且高压”中的隐裂。规则只涉及隐裂，没有排除其他缺陷，也没有给灯亮的唯一原因。","id":"Cv02","section":"v","limit":75,"opts":["凡是灯亮的零件都有隐裂","低压时测试灯绝不会亮","本次零件没有隐裂","本次零件没有任何缺陷"],"correct":2},{"context":"新包装在两个城市试销。甲城只铺精品店，复购较高；乙城只铺折扣店，复购较低。团队认为甲城消费者更喜爱新包装。","prompt":"要区分城市差异与渠道差异，最值得补哪组观察？","why":"目前城市和渠道完全重叠，不能区分两者。交叉覆盖城市与渠道后才有组内可比对象。","id":"Cv03","section":"v","limit":90,"opts":["两城都补采两类相近门店的同期数据","按两城人口比例重算现有两批客户的总体复购率","给已经完成复购的顾客统一发问卷，询问他们是否喜欢新包装","在甲城增加精品店样本，在乙城增加折扣店样本并统一样本量"],"correct":0},{"context":"有人说：降低结算页的填写项，让更多人完成付款，因此一定能提高每个付费客户的净收益。","prompt":"论证从哪一步跳得最远？","why":"总体付款人数与人均净收益分母、机制均不同。新增用户的金额、成本和退款情况都可能改变人均结果。","id":"Cv04","section":"v","limit":60,"opts":["旧用户填写熟练，减少字段的效果可能小于首次购买者","结算页是否应精简，还应比较工程投入和维护成本","结算步骤减少与实际完成付款之间需要行为数据验证","付款人数增加，不能推出人均净收益增加"],"correct":3},{"context":"有三人评审方案，每人只投一次赞成或反对。已知至少两人赞成；若甲赞成，乙一定反对。","prompt":"哪项必然为真？","why":"甲乙不能同时赞成，两人之中最多一票赞成。要凑足两票，丙必定赞成。甲、乙中究竟谁赞成无法确定。","id":"Cv05","section":"v","limit":75,"opts":["丙赞成","甲赞成","三人都赞成","乙反对"],"correct":0},{"context":"团队建立了故障匿名上报渠道。第一个月记录的轻微故障比过去多，严重事故没有增加。主管担心系统可靠性已变差。","prompt":"哪项发现最有助于区分真实故障增多和报告意愿提高？","why":"自动监测在检测规则稳定时提供相对独立的参照，人工报告覆盖率能帮助识别记录行为的变化。","id":"Cv06","section":"v","limit":90,"opts":["只比较由同一主管确认的人工报告，以消除故障类型口径差异","用不变的自动监测规则对照人工上报覆盖率","在报告里随机抽取相同比例，比较两期上报者描述问题的详细程度","把两期上报数量按总工时标准化，再比较每千工时的报告数"],"correct":1},{"context":"研究团队先选出年度销售增长最快的五家门店，再总结共同做法，发现它们都举办了会员活动。团队打算把活动推广到所有门店。","prompt":"哪种额外发现会最削弱其依据？","why":"只看赢家不知道该做法是否能区分成功与否；若低增长门店也同样普遍采用，原证据的区分力很弱。","id":"Cv07","section":"v","limit":60,"opts":["少数会员参加了不止一次，同一会员能出现在多期签到表上","五家门店的活动都集中在旺季，并各自保留了完整签到记录","低增长门店也同样普遍举办此类活动","五家门店各自采用的活动形式有差异，但核心权益相同"],"correct":2},{"context":"甲说，新工艺的成品率更好，应尽快采用。乙说，若连续停机换线，旺季交付损失可能超过良率收益。两人的数据都来自同一批设备。","prompt":"他们真正的分歧集中在哪里？","why":"乙并未否定良率收益，而是增加了停机交付损失这一成本项；评估边界不同。","id":"Cv08","section":"v","limit":75,"opts":["切换期的交付损失是否纳入决策","旺季客户是否只关心交付速度，忽视产品的一致性","评估设备是否要更换为覆盖 不考虑其他费用。","table":[["订单批次","销售额（万元）","按销售额计的退款率"],["试点","120","12%"],["对照","110","4%"]],"prompt":"两批扣除退款后的收入相差多少？","why":"试点 120×88% = 105.6 万元，对照 110×96% = 105.6 万元。较高的账面销售额没有变成净收入优势。","id":"Cd05","section":"d","limit":90,"opts":["试点高 0.8 万元","试点高 10 万元","对照高 0.8 万元","相同"],"correct":3},{"context":"团队上线前后各观察一周。估算方案采用“试点前后变化减去对照同期变化”，所有数值均为同口径的履约率。","table":[["群体","上线前","上线后"],["试点","78%","87%"],["对照","80%","84%"]],"prompt":"按给定方法，方案的估计增益是多少？","why":"试点变化 9 个百分点，对照变化 4 个百分点，相减为 5。上线后的组间差 3 个百分点没有校正起点。","id":"Cd06","section":"d","limit":60,"opts":["5 个百分点","7 个百分点","9 个百分点","3 个百分点"],"correct":0},{"context":"每次来电只能分到一个时段。均值按所有单次来电的等待时间计算。","table":[["时段","来电数","平均等待"],["上午","120","3 分钟"],["下午","80","8 分钟"],["晚上","50","待求"]],"prompt":"若全日平均等待正好 5 分钟，晚间平均等待是多少？","why":"全日等待 250×5 = 1,250 人分钟。晚间占 1,250−360−640 = 250 人分钟，除以 50 得 5 分钟。","id":"Cd07","section":"d","limit":75,"opts":["5 分钟","7 分钟","6 分钟","4 分钟"],"correct":0},{"context":"同一批顾客做了两轮测试，记录每轮是否通过。","table":[["事项","人数"],["参与两轮","200"],["第一轮通过","110"],["第二轮通过","130"],["两轮都通过","80"]],"prompt":"在第一轮未通过的人中，有多少比例在第二轮通过？","why":"第一轮未过有 90 人；仅第二轮通过为 130−80 = 50 人。条件比例 = 50/90，约为 55.6%。","id":"Cd08","section":"d","limit":90,"opts":["25%","约 72.2%","约 55.6%","约 38.5%"],"correct":2},{"context":"试验的两个版本按照相同条件获客；每笔成交均只产生一次贡献。","table":[["版本","转化率","每笔成交毛利","每位访客服务成本"],["甲","8%","60 元","1 元"],["乙","10%","50 元","1.5 元"]],"prompt":"按每千访客的毛利减服务成本，哪一版本更好？","why":"甲 1,000×8%×60−1,000 = 3,800 元；乙 1,000×10%×50−1,500 = 3,500 元。应同时考虑转化、毛利与成本。","id":"Cd09","section":"d","limit":60,"opts":["甲多 500 元","甲多 300 元","乙多 300 元","乙多 200 元"],"correct":1},{"context":"某业务来年可选只做基础项目，也可以加一项试点。基础项目净收益已确定；试点结果互斥且覆盖所有情况。","table":[["项目","情形","净收益"],["基础","确定","80 万元"],["附加试点","成功，概率 60%","额外赚 50 万元"],["附加试点","失败，概率 40%","额外亏 30 万元"]],"prompt":"若采用“基础＋试点”，期望总净收益是多少？","why":"试点增量期望 = 0.6×50 − 0.4×30 = 18 万元。加确定的 80 万元，合计 98 万元。","id":"Cd10","section":"d","limit":75,"opts":["100 万元","86 万元","110 万元","98 万元"],"correct":3}],"f":[{"prompt":"前两幅作用的次序很重要。依照示范补全右 在哪里？","cols":1,"frames":[["grid",2,"1"]],"why":"先撤销上下折叠，孔落在第 1 和第 4 行；再撤销左右折叠，孔落在第 2 和第 3 列。因此两行各有中间两个孔。","id":"Cf07","section":"f","limit":75,"opts":[["grid",4,"1,2,9,10"],["grid",4,"5,6,9,10"],["grid",4,"0,3,12,15"],["grid",4,"1,2,13,14"]],"correct":3},{"prompt":"每个位置都取决于上一行。观察同列的纵向规律，补全最后一格。","cols":3,"frames":[["grid",3,"01"],["grid",3,"05"],["grid",3,"34"],["grid",3,"25"],["grid",3,"27"],["grid",3,"14"],["grid",3,"78"],["grid",3,"38"],null],"why":"沿每一列向下，黑格图案都顺时针转 90°。第三列从中左＋中心，转成上中＋中心，再转成中右＋中心。","id":"Cf08","section":"f","limit":90,"opts":[["grid",3,"45"],["grid",3,"34"],["grid",3,"14"],["grid",3,"47"]],"correct":0},{"prompt":"左图先左右翻转，再交换黑白。按这两步补全最后的右图。","cols":2,"frames":[["grid",3,"01"],["grid",3,"0345678"],["grid",3,"025"],["grid",3,"145678"],["grid",3,"046"],null],"why":"先镜像：左上、中心、左下移为右上、中心、右下。再将这三格留白，其他六格涂黑。","id":"Cf09","section":"f","limit":60,"opts":[["grid",3,"123578"],["grid",3,"245"],["grid",3,"0135678"],["grid",3,"013567"]],"correct":3},{"prompt":"把展开图折成立方体。下列哪组三个面能在同一个顶点相遇？","cols":1,"frames":[["net","PQRSUV"]],"why":"横排中 P 与 R、Q 与 S 分别相对，盖面 U 与 V 相对。一个顶点恰从每组相对面中取一个；只有 P、Q、U 符合。","id":"Cf10","section":"f","limit":75,"opts":["P、R、U","Q、S、V","P、U、V","P、Q、U"],"correct":3}]},"c-d":{"v":[{"context":"许多组织把复杂项目拆成标准模块，希望减少部门之间的反复协调。这一做法在需求稳定、接口清晰时很有效，但一项局部改进也可能改变其他模块赖以工作的条件。问题往往不是任何一个部门没有完成指标，而是每个部门都完成了自己的指标，整体结果却变差了。因此，模块化程度越高，越需要有人持续检查接口假设是否仍然成立。设立这一责任，并不意味着让所有日常决策重新集中到一个人手里。","prompt":"这段文字主要强调什么？","why":"落脚点是“持续检查接口假设”，最后一句又限定了这种责任不等于日常集权。正确项同时保留两层意思。其余三项分别把适用条件当主旨、推出文中没有提出的指标替换、把整体责任扩大成逐项审批。","id":"Dv01","section":"v","limit":60,"opts":["模块化的主要价值在于减少协调，因此应先稳定需求再逐步扩大应用","模块化应配套对接口和整体结果的持续负责，同时保留日常决策的分工","局部指标与整体结果可能冲突，因此应将部门指标统一为整体结果指标","复杂项目的风险主要来自责任分散，应由统一负责人审批跨模块决策"],"correct":1},{"context":"某市将一批图书馆延时至晚间开放。半年后，这些馆的到馆人数增长了 18%，而未延时的馆只增长了 4%。管理部门据此认为，延时开放显著增加了当地居民使用公共图书馆的总量，建议全市推广。两组图书馆同期均未新增馆舍，统计口径也没有变化。","prompt":"下列新增信息若为真，哪项最能削弱“增加了总量”的判断？","why":"论点是全市使用总量增加，关键反证是原有需求在馆间转移而非新增。费用涉及是否划算，馆际差异涉及适用范围，晚间偏好解释时段选择；三者都不直接否定总量增长。","id":"Dv02","section":"v","limit":75,"opts":["按匿名读者标识去重后发现，新增到馆记录主要来自原本会去邻近未延时馆的读者，其全市到馆总次数基本不变","延时馆中，交通便利的大馆人数增幅较大，交通不便的小馆增幅较小","延时馆的晚间照明和安保费用增长幅度，高于其到馆人数增长幅度","调查中，多数晚间读者表示更喜欢晚上阅读，而不是白天阅读"],"correct":0},{"context":"甲、乙、丙、丁、戊、己六个项目中恰好选三个试点。要求：甲、乙中恰有一个入选；丙入选则丁也入选；戊与丁不能同时入选；己入选则乙入选。已知戊入选。","prompt":"根据以上条件，哪项一定成立？","why":"戊入选排除丁；丙要求丁，因此丙也排除。剩下甲、乙、己中还须选两个，而甲乙恰选一个，所以必须选己；己又要求乙，最终唯一组合为乙、戊、己。把乙或己是否入选说成无法确定的表述，错在把已经确定的结果说成无法确定。","id":"Dv03","section":"v","limit":90,"opts":["乙入选，但己是否入选无法确定","乙和己都入选","丙和己中至少有一个不入选，但乙是否入选无法确定","甲和己中恰有一个入选"],"correct":1},{"context":"一项研究比较了两种培训方案。参加甲方案的员工，结训后的任务得分平均比参加乙方案者高 8 分。研究者已控制年龄、工龄和结训测试版本，因而断言甲方案本身更有效。两种方案均由员工自行报名，未比较报名者培训前的任务水平。","prompt":"若只能补充一项证据，哪项最能增强“方案本身更有效”的判断？","why":"原研究的主要缺口是自选方案造成的基线差异。随机分配并比较增量，最直接地处理这个缺口。满意度不是任务效果；扩大同类样本不能消除选择偏差；课程与参与投入差异提供机制线索，却不能排除报名者本来就不同。","id":"Dv04","section":"v","limit":60,"opts":["甲方案的课程更长，授课教师资历更高，报名者完成练习的数量更多","在另一批员工中先测基线，再随机分配方案；两组出勤相近，甲组得分增量仍明显更大","将原研究样本扩大十倍后，甲、乙方案结训得分的差距仍为 8 分","甲方案参与者的结训满意度更高，而且愿意向同事推荐的比例也更高"],"correct":1},{"context":"某团队将客户咨询的首次响应中位时长从 8 分钟降至 1 分钟，但同期投诉率没有下降。负责人提出：只要进一步缩短首次响应，就能改善客户体验。运营同事指出，系统现在会自动发出“已收到”，这条消息也被计入首次响应；复杂问题的实际解决时间并未缩短。","prompt":"负责人的推断最依赖以下哪项假设？","why":"负责人把响应指标改善推到体验改善，必须让该指标与实质帮助有联系。若响应只是自动回执，指标可以持续变好而客户问题仍未解决。其余选项可能影响运营，但不是这条推断必需的连接。","id":"Dv05","section":"v","limit":75,"opts":["统计中的首次响应能代表客户获得实质帮助的进展，而不仅是收到确认消息","客户提出投诉时，会准确说出自己最不满意的环节","所有咨询都应由同一支客服团队处理，以便保持回复一致","处理复杂问题通常比处理简单问题耗费更多人力"],"correct":0},{"context":"①但这种优势有一个前提：指标仍能代表真正想要的结果。②因此，管理者既要利用指标压缩决策成本，也要定期回到具体案例，检查这种压缩丢掉了什么。③指标的价值，在于把大量分散信息压缩成便于比较的信号。④一旦奖惩紧紧围绕这个信号展开，参与者就可能改变行为，使信号上升而结果没有改善。⑤这能使组织不必逐案讨论，也能及时识别异常。","prompt":"将五句话组成语意连贯的一段，最恰当的顺序是？","why":"③先定义压缩信号；⑤用“这”承接并解释优势；①的“这种优势”转入适用前提；④说明前提怎样被破坏；②据此给出兼顾效率与校验的结论。其他顺序分别打断优势的承接、先出现无指代的“这”、或把结论放在关键前提前面。","id":"Dv06","section":"v","limit":90,"opts":["③⑤④②①","③①⑤④②","③⑤①④②","⑤③④①②"],"correct":2},{"context":"评价一项新技术，既不能因为短期指标没有跃升就否定其潜力，也不能把未来可能出现的收益提前当成已经兑现的价值。较好的做法，是把长期判断拆成可观察的阶段条件：哪些条件已满足，哪些仍依赖未经验证的假设。这样，继续投入就不是对最初判断的反复表态，而是对新增证据的持续回应。","prompt":"下列说法中，哪项最符合文意？","why":"文中同时拒绝“短期没涨就否定”和“未来收益提前兑现”，主张用证据更新投入。“只验证技术潜力而不评价实际产出”人为排除了可用证据；“不据短期指标调整投入”切断证据与投入的联系；“取代对长期价值的判断”则把辅助判断的条件变成了对判断本身的替代。","id":"Dv07","section":"v","limit":60,"opts":["只要长期方向判断正确，短期指标就主要用于管理执行节奏而不用于调整投入","长期收益难以直接观察，因此阶段条件应取代对长期价值本身的判断","长期潜力可以支持分阶段投入，但投入应随关键假设的验证结果调整","在长期收益尚未兑现前，阶段指标应以验证技术潜力为主而不评价实际产出"],"correct":2},{"context":"一种政策在试点中取得效果，并不意味着扩大覆盖后还能得到同样结果。试点地区往往得到更密集的支持，参与者也可能更积极。因此，推广评估不能只问“效果是否出现”，还应问“效果在多大程度上依赖试点特有条件”。如果这些条件在推广中无法维持，直接沿用试点的收益估计就容易产生偏差。","prompt":"以下哪种做法最直接回应了文段指出的问题？","why":"问题是试点条件与推广条件是否可比，正确项主动改变支持和参与条件检验可推广性。延长观察解决持续性，增加原样本解决精度，汇总其他政策给出间接参照，都未直接验证本政策对特殊条件的依赖。","id":"Dv08","section":"v","limit":75,"opts":["继续扩大原试点的样本量，使其平均效果的估计更精确","汇总已成功推广的相似政策，计算其收益估计的平均误差","延长原试点的观察期，核实其效果是否能保持更长时间","在普通支持强度下，选择参与意愿不同的地区再测试，分别估计效果"],"correct":3},{"context":"当市场信号快速变化时，保持战略稳定并不等于把既定动作一成不变地执行下去。需要保持的是对核心目标的____，需要调整的是实现目标的路径。若把路径也当成不可改变的承诺，原本用于避免短期摇摆的纪律，就可能____为拒绝新证据的理由。","prompt":"依次填入横线，最恰当的一组是？","why":"前一空要求“持续不偏离核心目标”，坚守最准确。后一空写纪律从正当用途变成相反作用，异化能表达这种性质改变。“简化”只表示变简单；“转化”虽能描述变化，但“对目标的预判”不符合保持目标的语境；“约束为理由”的搭配和含义也不成立。","id":"Dv09","section":"v","limit":90,"opts":["坚守；异化","预判；转化","约束；固化","认同；简化"],"correct":0},{"context":"某工厂为减少设备故障，引入了一套提前预警系统。上线后，故障停机次数下降了，但被系统识别为“高风险”的设备中，最终发生故障的比例也明显低于上线前的历史风险模型。有人据此认为，新系统的识别准确性更差了。","prompt":"以下哪项若为真，最能解释这种看似矛盾的现象？","why":"预警触发了干预，因而“后来没故障”不能直接当作原先风险识别错误。其他选项分别说明数据量、口径一致和设备分布，都没有解释为何高风险设备最终较少故障。这里需要区分预测改变行动后的结果与未干预时的风险。","id":"Dv10","section":"v","limit":60,"opts":["新系统上线后，被预警的设备主要集中在使用年限较长的生产线上","新旧系统都将停机超过十分钟且影响生产的事件定义为故障","新系统对传感器的采样频率更高，因此积累了更多设备运行记录","维修人员会优先检修被预警的设备，从而在故障发生前消除了部分风险"],"correct":3}],"d":[{"context":"有效率＝有效线索数÷线索总量。为区分渠道结构变化与渠道自身变化，分析师计划用上期渠道占比，重新加权本期各渠道有效率。","table":[["渠道","上期线索","上期有效","本期线索","本期有效"],["甲","3,000","2,100","6,000","3,900"],["乙","7,000","3,500","4,000","1,800"]],"prompt":"重新加权后的本期有效率，比上期整体有效率低多少个百分点？","why":"上期整体为 (2100＋3500)÷10000＝56%。本期甲、乙分别为 65%、45%，沿用上期 30%、70% 的占比得 51%，低 5 个百分点。本期实际整体是 57%；它与 56% 的比较混入了渠道结构变化。注意百分点与相对下降比例不同。","id":"Dd01","section":"d","limit":75,"opts" ction":"d","limit":75,"opts":["60 万元","61 万元","63 万元","58 万元"],"correct":0}],"f":[{"prompt":"观察每行三幅图之间的关系，选择填入问号处的图形。","cols":3,"frames":[["grid",3,"013"],["grid",3,"245"],["grid",3,"14"],["grid",3,"047"],["grid",3,"126"],["grid",3,"1346"],["grid",3,"027"],["grid",3,"348"],null],"why":"每行先把左图顺时针旋转 90°，再与中图叠加：两图都黑的格子变白，只在一图为黑的格子保留。末行左图旋转后，黑格在右上、中左、右下；与中图的中左、中心、右下叠加，重合的中左和右下抵消，最终只保留右上和中心。","id":"Df01","section":"f","limit":75,"opts":[["grid",3,"06"],["grid",3,"24"],["grid",3,"38"],["grid",3,"27"]],"correct":1},{"prompt":"各行遵循相同规律。哪幅图应填在问号处？","cols":3,"frames":[["dial",1,2],["dial",2,5],["dial",3,7],["dial",2,3],["dial",4,2],["dial",6,5],["dial",3,6],["dial",4,5],null],"why":"以正上方为 0，沿顺时针将八个方向记为 0 至 7。每行第三图的指针位置为前两图位置之和，超过 7 则绕回；外圈圆点也独立相加。末行指针 3＋4＝7（左上），圆点 6＋5＝11，绕回为 3（右下）。","id":"Df02","section":"f","limit":90,"opts":[["dial",7,3],["dial",6,4],["dial",7,1],["dial",1,3]],"correct":0},{"prompt":"按从左到右、从上到下的顺序观察，选择第八幅图。","cols":4,"frames":[["grid",3,"013"],["grid",3,"025"],["grid",3,"125"],["grid",3,"016"],["grid",3,"578"],["grid",3,"368"],["grid",3,"367"],null],"why":"将奇数位和偶数位分开：第 1、3、5、7 幅每次顺时针转 90°；第 2、4、6、8 幅每次逆时针转 90°。第八幅等于第二幅连续逆时针转三次，也就是顺时针转一次，黑格位于右上、下中、右下。","id":"Df03","section":"f","limit":60,"opts":[["grid",3,"025"],["grid",3,"368"],["grid",3,"125"],["grid",3,"278"]],"correct":3},{"prompt":"将展开图折成方块放在桌上，初始 B 面正对你、E 面朝上。先向你的右手边翻滚 90°，再向你翻滚 90°，最后再向右手边翻滚 90°；过程中不额外转向。最终朝上、正对你的面依次是什么？","cols":1,"frames":[["net","ABCDEF"]],"why":"初始上 E、下 F、前 B、后 D、左 A、右 C。第一次向右后，上 A、右 E、下 C、左 F，前后不变。向你滚动后，上 D、前 A、下 B、后 C，左右不变。最后向右后，上 F，前仍为 A。","id":"Df04","section":"f","limit":75,"opts":["D、A","F、A","F、C","E、A"],"correct":1},{"prompt":"白、灰、黑表示三种不同状态。根据前两行，补全第三行。","cols":3,"frames":[["shade",2,[1,2,0,1]],["shade",2,[1,1,2,0]],["shade",2,[2,0,2,1]],["shade",2,[2,1,2,0]],["shade",2,[2,2,1,1]],["shade",2,[1,0,0,1]],["shade",2,[1,0,2,2]],["shade",2,[2,1,2,0]],null],"why":"逐格观察，每行前两图叠加：白不改变另一状态，灰＋灰＝黑，灰＋黑＝白，黑＋黑＝灰。也可将白、灰、黑记为 0、1、2，相加后按三状态循环。末图从左上按行依次是白、灰、灰、黑。","id":"Df05","section":"f","lim 条对称轴；左上、中左、中右、右下的图案只有中心对称而没有轴对称；另一项既无轴对称也无中心对称。要求是恰好一条轴，而不是有某一种旋转后相似的感觉。","id":"Df10","section":"f","limit":75,"opts":[["grid",3,"0137"],["grid",3,"0358"],["grid",3,"0268"],["grid",3,"1256"]],"correct":3}]},"c-e":{"v":[{"context":"一家政务服务中心增加了周六办理时段，周六到访人数逐月上升。中心据此认为，新时段让原先因工作安排而无法办理的人获得了服务。","prompt":"以下哪条新增信息最能支持中心的解释？","why":"先拆结论：对象是“原先无法办理的人”，机制是“工作日时间障碍被解除”。正确项同时对准对象和机制。原有办事者改到周六，是需求换时段的替代解释；办理更快和名额更满，都不能证明新增的是原来被排除的人。","id":"Ev01","section":"v","limit":60,"opts":["周六首次来办理的人中，多数此前因工作日不能请假而一直未能到场","原来工作日来办理的人中，多数认为周六排队环境更舒适","工作日与周六相比，周六的人均办理时间更短","周六预约名额的使用率高于刚推出时，并保持了数周"],"correct":0},{"context":"三个主动报名的小组试用新复核流程后，差错率都下降了。同期没有设置对照组，也没有记录这些小组是否同时更换人员。报告初稿写道：“新流程降低了全公司的差错率。”","prompt":"根据现有证据，最合适的改写是？","why":"要分开两道边界：有没有观察到下降，以及能否把下降归因于流程。前后记录能确认这三个组下降了，却不能排除人员变化等原因，也不能代表全公司。声称“新流程已降低三个小组的差错率”只收缩了人群范围，仍然越过了因果边界；声称“不能确认是否下降”则把可以描述的事实也否定了。","id":"Ev02","section":"v","limit":75,"opts":["三个试用小组的差错率在实施后下降；流程的因果作用及对其他小组的效果仍待检验","三个小组均有改善，表明新流程的作用在公司内较稳定","新流程已降低三个试用小组的差错率，只是尚不能推广到全公司","由于没有设置对照组，目前不能确认三个小组的差错率是否下降"],"correct":0},{"context":"某线上讲座增开夜间场，夜间参加人数明显增加。运营团队解释说，这让原先受时间限制的人进入了课程，因此扩大了独立参与者的规模。","prompt":"以下哪项最能削弱这一解释？","why":"论点是“独立人群扩大”，不是“夜间有人来”。同一批人从白天转到夜间，且去重人数不变，直接给出了替代解释。质量、成本和不同主题表现可以影响推广决定，却不直接否定是否增加了独立参与者。快速判断时先圈住结论里的统计对象。","id":"Ev03","section":"v","limit":90,"opts":["夜间到课率在不同主题之间差异较大，热门主题明显更高","夜间讲师的补贴更高，因此每场课程的直接成本上升","按账号去重后发现，夜间参与者主要是从白天场转来的老学员，各周独立参与人数基本不变","夜间参与者对课程质量的评价，与白天参与者没有明显差异"],"correct":2},{"context":"某公司把 200 名处理同类工单的员工随机分成两组，一组采用新复核流程，另一组沿用旧流程。两组培训、工单分配和观察期相同，均完整跟踪。试验组差错率明显较低，且这一差异通过了事先约定的统计检验。","prompt":"下列结论中，证据支持最充分的是？","why":"这里有随机分组、同期对照和一致观察条件，可以在试验范围内作较强的因果判断。不能机械地一律选“无法判断因果”。但组平均效果不等于每个人都改善，处理同类工单的结果也不能直接扩大到其他业务。","id":"Ev04","section":"v","limit":60,"opts":["新流程已证明能让每位员工的差错率都下降","在这次试验条件下，有证据支持新复核流程降低了平均差错率","新流程只与差错率相关，随机分组也不能为因果判断提供帮助","新流程对其他类型工单也会产生同等幅度的改善"],"correct":1},{"context":"使用知识库较多的客服，解决复杂问题的平均时间更短。主管据此断言：“增加知识库使用次数，就能缩短处理时间。”但资深客服也可能更熟悉知识库，并且本来就处理得更快。","prompt":"如果只能补一项研究，哪项最有助于区分这两种解释？","why":"争议在于知识库作用，还是资历等共同因素。相近人员处理相近问题，再随机改变入口，能更直接地区分解释。扩大同样的观察样本不会自动消除资历差异；高频使用者访谈和月度总量比较，也缺少可比的反事实。","id":"Ev05","section":"v","limit":75,"opts":["扩大现有样本，继续比较高频使用者与低频使用者的平均处理时间","在资历相近且处理同类问题的人中，随机安排一半使用新的检索入口，再比较处理时间","比较各月份全体客服的知识库总访问量与工单总处理量","访问使用次数最多的十名客服，汇总他们对知识库的评价"],"correct":1},{"context":"一次小规模试验中，两种提醒方式的完成率分别为 61% 和 58%。样本较少，差异未达到事先约定的统计判断标准。负责人希望据此判断两种提醒是否可以视为等效。","prompt":"哪项表述最符合已有证据？","why":"“尚未确认有差异”和“已确认无实质差异”不是同一结论。等效需要专门的容许差异范围与足够证据；小样本下未检出差异不能直接代替。现有完成率仍然可以作为样本中的观察结果报告。","id":"Ev06","section":"v","limit":90,"opts":["差异未达到判断标准，可以据此认定两种方式等效","样本较少，因此连这批参与者的完成率都不能报告","完成率相差 3 个百分点，已足以证明第一种方式更有效","本次未得到足够证据确认两者存在差异，但这不等于已经证明两者等效"],"correct":3},{"context":"一款预约工具推出代办功能后，预约成功人数上升。产品团队认为，增量主要来自过去不熟悉操作的用户，而不是原有熟练用户增加了预约次数。","prompt":"以下新增信息中，哪项最直接支持团队的解释？","why":"正确项识别了“新增成功用户是谁”，并连接到原有操作障碍。点击量和满意度没有识别增量来源；熟练用户发起更多预约则支持了与团队结论竞争的解释。注意这里要比较独立用户，而不只是事件次数。","id":"Ev07","section":"v","limit":60,"opts":["代办功能页面的点击量持续上升，且高于其他新功能","将用户去重并与历史操作记录匹配后，新增成功用户主要来自此前多次在操作环节退出的人群","原有熟练用户平均每人发起的预约次数增加了","上线后，预约成功者对产品的整体满意度有所提高"],"correct":1},{"context":"某单位对主动报名参加训练营的人进行结训调查，82% 表示自己更愿意带团队。没有调查未报名者，也没有进行训练前调查。宣传稿据此写道：“训练营使全体员工的管理意愿明显增强。”","prompt":"哪项修订最准确地保留了调查能说明的内容？","why":"证据是结训后的自我报告，且只覆盖报名并受访者。没有前测和可比对照，不能把报告内容直接当作训练造成的变化；自愿报名也不是随机抽样。先保留准确的描述，再限制因果与人群范围，比只加“样本有限”更完整。","id":"Ev08","section":"v","limit":75,"opts":["由于报名者主动参与，可把他们视为管理意愿较强员工的随机样本","训练营已提升报名者的管理意愿，但尚不能推广到未报名者","82% 的比例较高，可推断全体员工的管理意愿总体增强","结训调查中，82% 的受访报名者表示更愿意带团队；不能据此确认训练的因果作用或全体员工的变化"],"correct":3},{"context":"某仓库对符合相同条件的订单随机分配两种打包方式。所有被分配订单均纳入分析，配送渠道和观察期限一致。新方式的破损率较低，差异符合事先设定的判断标准；每单材料费用也略低。","prompt":"仅根据这些结果，下列哪项判断最恰当？","why":"随机分配和完整跟踪支持试验范围内的因果判断，观察范围有限不等于范围内也什么都不能判断。材料费降低还不等于所有成本已下降；能否推广到其他订单和渠道，需要检验条件是否可比。","id":"Ev09","section":"v","limit":90,"opts":["只要存在随机分配，新方式的效果就可直接推广至所有订单与配送渠道","费用较低说明利润一定较高，其他处理成本无需再核算","在所测试的订单和配送条件下，新方式降低破损率的因果解释得到支持，材料费也较低","由于研究只发生在一个仓库，不能判断新方式对该仓库订单有无作用"],"correct":2},{"context":"一份报告只统计了仍在运营的项目，发现引入新管理制度的项目收入增长更快。报告没有纳入已经关闭的项目，也没有比较制度实施前的增长趋势。","prompt":"下面哪句话最适合作为报告结论？","why":"有两层缺口：只看存续项目可能造成选择偏差；缺少实施前趋势等信息也无法排除原有差异。补齐关闭项目能改善覆盖范围，却不自动解决因果识别。快速检查结论时，把“相关还是因果”和“样本还是总体”分别问一遍。","id":"Ev10","section":"v","limit":60,"opts":["新制度已使存续项目增长加快，只有关闭项目的效果尚不清楚","收入增长更快说明制度有效，是否纳入关闭项目只影响样本量","在被统计的存续项目中，采用新制度与较快增长同时出现；因果作用和全体项目表现尚不能据此确定","只要补入关闭项目，就能确定新制度对收入增长的因果效果"],"correct":2}],"d":[{"context":"比较用户注册后第 30 天的留存情况，只把已完整观察 30 天的用户纳入分母。表中的留存人数均来自该批已满 30 天者。","table":[["批次","注册总人数","已满 30 天","其中留存"],["甲","2,800","1,800","270"],["乙","4,200","2,400","432"]],"prompt":"按可比观察窗口，乙批留存率比甲批高多少个百分点？","why":"先圈定分母“已满 30 天”。甲 270÷1800＝15%，乙 432÷2400＝18%，差 3 个百分点。若把所有注册者放入分母，会混入未到观察期者；18%÷15%−1＝20% 是相对增幅，不是 20 个百分点。","id":"Ed01","section":"d","limit":75,"opts":["反而低约 4.7 个百分点","20 个百分点","3 个百分点","约 0.6 个百分点"],"correct":2},{"context":"共有 360 人先后参加两轮测试，每人均参加了两轮。“两轮都通过”属于每轮通过人数的一部分。","table":[["统计项","人数"],["参加人数","360"],["第一轮通过","240"],["第二轮通过","210"],["两轮都通过","180"]],"prompt":"在第一轮未通过的人中，有多少比例在第二轮通过？","why":"题目限定的人群是第一轮未过者：360−240＝120 人。两轮都过的 180 人不能再计入这一人群，因此所求分子为 210−180＝30。30÷120＝25%。可先写“只第二轮通过÷第一轮未过”，再代数字，减少来回读表。","id":"Ed02","section":"d","limit":90,"opts":["8.3%","50%","58.3%","25%"],"correct":3},{"context":"续费分析只统计已同意参与且已完整观察 30 天的用户。“已满观察期”列已同时满足这两个条件，续费人数来自该列。","table":[["批次","注册人数","同意参与","已满观察期","其中续费"],["甲","1,800","1,200","800","144"],["乙","1,600","1,400","1,000","170"]],"prompt":"按规定口径，乙批续费率与甲批相比如何？","why":"甲 144÷800＝18%，乙 170÷1000＝17%，乙低 1 个百分点。乙续费人数更多不代表率更高。注册人数和同意参与人数都不是题目指定的最终分母；先确定统计资格，再比较比例。","id":"Ed03","section":"d","limit":60,"opts":["高约 18.1%","低 1 个百分点","高 1 个百分点","高约 1.2 个百分点"],"correct":1},{"context":"要计算两个渠道合并后的首周转化率，只统计已满 7 天的客户；各渠道客户互不重复。转化人数来自已满 7 天的客户。","table":[["渠道","全部客户","已满 7 天","其中转化"],["甲","2,000","1,200","180"],["乙","1,500","800","160"]],"prompt":"合并后的可比首周转化率是多少？","why":"先合并同口径的人数：(180＋160)÷(1200＋800)＝340÷2000＝17%。两个渠道率为 15%、20%，直接取平均得 17.5% 会忽略人数权重；340÷3500 则把尚未满 7 天的客户错误纳入。","id":"Ed04","section":"d","limit":75,"opts":["约 9.7%","17.5%","15%","17%"],"correct":3},{"context":"两种服务均由固定月费和按件收费组成，没有其他费用。服务量为非负整数。","table":[["方案","固定月费","每件费用"],["甲","2,200 元","2.5 元"],["乙","700 元","6 元"]],"prompt":"甲的总费用第一次严格低于乙，至少需要多少件？","why":"2200＋2.5n＜700＋6n，得到 1500＜3.5n，即 n＞428.571…，最小整数是 429。快速做法：固定费差 1500，单件省 3.5；先除出临界值，再检查“严格”和整数。此处临界值不是整数，不能机械地先四舍五入再加 1。","id":"Ed05","section":"d","limit":90,"opts":["429 件","430 件","600 件","428 件"],"correct":0},{"context":"两种服务按下表收费，均无其他费用。要求甲的总费用不高于乙总费用的 90%，服务量为整数。","table":[["方案","固定月费","每件费用"],["甲","1,800 元","4 元"],["乙","600 元","8 元"]],"prompt":"满足这一要求的最小服务量是多少？","why":"条件不是甲比乙便宜，而是甲≤乙的 90%：1800＋4n≤0.9(600＋8n)，所以 1260≤3.2n，n≥393.75，取 394。注意 90% 要乘乙的全部费用，不能只乘其按件部分，也不能沿用普通盈亏平衡点 300。","id":"Ed06","section":"d","limit":60,"opts":["300 件","393 件","394 件","301 件"],"correct":2},{"context":"甲方案月费包含前 200 件，超过部分另收费；乙方案所有件数均按件收费。只考虑服务量超过 200 件的情况。","table":[["方案","固定月费","按件费用"],["甲","1,500 元（含前 200 件）","超出 200 件的部分每件 3 元"],["乙","500 元","每件 7 元"]],"prompt":"甲相较乙每月严格节省超过 1,000 元，最少需要多少件？","why":"甲＝1500＋3(n−200)＝900＋3n；乙＝500＋7n。乙−甲＝4n−400，要求＞1000，故 n＞350，最小 351。350 件恰好省 1000，不满足“严格超过”。先扣除套餐已含件数，再处理不等号。","id":"Ed07","section":"d","limit":75,"opts":["201 件","350 件","351 件","250 件"],"correct":2},{"context":"每个访客最多成交一单。退款订单的毛利按 0 计，未退款订单使用表中每单毛利；服务成本对所有访客收取，与是否成交、退款无关。","table":[["版本","转化率","退款率","未退款每单毛利","每访客服务成本"],["甲","9%","10%","70 元","1.2 元"],["乙","12%","20%","55 元","1.5 元"]],"prompt":"每 1,000 名访客产生的毛利扣服务成本后，哪一版本更高？","why":"甲＝1000×9%×90%×70−1000×1.2＝4470；乙＝1000×12%×80%×55−1000×1.5＝3780，甲高 690。先写统一公式“访客×转化×留存订单比例×每单毛利−访客×服务成本”，防止把访客成本误按订单数扣。","id":"Ed08","section":"d","limit":90,"opts":["乙高 300 元","甲高 690 元","乙高 420 元","甲高 390 元"],"correct":1},{"context":"两个渠道的成交订单均来自表中访客，每名访客至多成交一次。毛利未扣访客服务成本，且不考虑退款。","table":[["渠道","访客数","成交单数","每单毛利","每访客服务成本"],["甲","5,000","300","80 元","1 元"],["乙","8,000","640","60 元","0.8 元"]],"prompt":"统一到每 1,000 名访客后，毛利扣服务成本的贡献如何比较？","why":"先把转化率算成甲 6%、乙 8%。甲每访客贡献＝0.06×80−1＝3.8；乙＝0.08×60−0.8＝4.0，相差 0.2 元，乘 1000 得乙高 200。两者每访客毛利原本都是 4.8，服务成本不同才产生净贡献差。","id":"Ed09","section":"d","limit":60,"opts":["乙高 200 元","甲高 200 元","乙高 1,200 元","两者相同"],"correct":0},{"context":"每位访客至多成交一单。每单毛利尚未扣售后成本；售后成本按成交订单收取，基础服务成本按所有访客收取，无其他成本。","table":[["版本","转化率","每单毛利","每单售后成本","每访客基础成本"],["甲","10%","45 元","5 元","0.6 元"],["乙","12%","40 元","8 元","0.5 元"]],"prompt":"每 1,000 名访客的净贡献，哪一版本更高？","why":"甲＝1000×10%×(45−5)−1000×0.6＝3400；乙＝1000×12%×(40−8)−1000×0.5＝3340，甲高 60。把每单成本与毛利放在同一个括号里，每访客成本单独扣，能同时减少口径错误和计算步骤。","id":"Ed10","section":"d","limit":75,"opts":["乙高 140 元","甲高 60 元","乙高 60 元","甲高 500 元"],"correct":1}],"f":[{"prompt":"按顺序观察，选择下一幅图。","cols":5,"frames":[["dial",0,6],["dial",1,4],["dial",2,2],["dial",3,0],null],"why":"把指针与外圈圆点拆开记录。指针每次顺时针走 1 格：上、右上、右、右下，下一步向下；圆点每次逆时针走 2 格：左、下、右、上，下一步回到左。先筛指针正确的选项，再核对圆点，不能只核一条线索。","id":"Ef01","section":"f","limit":75,"opts":[["dial",4,0],["dial",4,2],["dial",5,6],["dial",4,6]],"correct":3},{"prompt":"观察九宫格中的变化，选择右下角应填的图。","cols":3,"frames":[["grid",3,"013"],["grid",3,"057"],["grid",3,"014"],["grid",3,"125"],["grid",3,"237"],["grid",3,"245"],["grid",3,"578"],["grid",3,"138"],null],"why":"逐列向下，整幅黑格图案每次顺时针旋转 90°。第三列从左上、上中、中心，变为右上、中心、中右，再变为中心、下中、右下。可以先追踪一个角上的黑格，确定旋转方向，再检查其余黑格；中心在旋转中始终不动。","id":"Ef02","section":"f","limit":90,"opts":[["grid",3,"014"],["grid",3,"456"],["grid",3,"024"],["grid",3,"478"]],"correct":3},{"prompt":"将一张 4×4 方格纸的右半向左对折，再将下半向上对折。图示为折好的 2×2 纸层，黑格处打穿所有层。完全展开后，孔在哪里？","cols":1,"frames":[["grid",2,"2"]],"why":"黑格在折后第 2 行、第 1 列。逆序撤销最后一次上下折叠，对应原纸第 2、3 行；再撤销左右折叠，对应第 1、4 列。最终这两行各在两端有孔。展开是关于折痕镜像，不是把孔等距离向一个方向平移。","id":"Ef03","section":"f","limit":60,"opts":[["grid",4,"4,7,12,15"],["grid",4,"4,7,8,11"],["grid",4,"0,3,12,15"],["grid",4,"5,6,9,10"]],"correct":1},{"prompt":"前两行遵循同一关系，选择问号处的骨牌。","cols":3,"frames":[["dom",2,6],["dom",1,2],["dom",3,4],["dom",1,2],["dom",4,5],["dom",5,3],["dom",2,1],["dom",3,5],null],"why":"每行第三张的左端等于前两张左端相加，右端等于前两张右端之差的绝对值。末行左端 2＋3＝5，右端 |1−5|＝4。先分别记左右规则，再用第二行检验；第二行右端的减法为负时仍取绝对值，不能临时改成相加。","id":"Ef04","section":"f","limit":75,"opts":[["dom",5,4],["dom",1,4],["dom",4,5],["dom",5,6]],"correct":0},{"prompt":"三行使用相同关系。选择右下角的柱形组合，各图共用相同基线和高度单位。","cols":3,"frames":[["bars",[3,1,2]], "4"]],"correct":0},{"prompt":"分别追踪指针和外圈圆点，选择下一幅。","cols":5,"frames":[["dial",6,0],["dial",4,1],["dial",2,2],["dial",0,3],null],"why":"指针每步逆时针转 90°，从上回到左；圆点每步顺时针转 45°，从右下到下。下一幅指针向左、圆点在下。与上一组变式相比，两个运动方向交换了，不能照搬记住的方向。","id":"Ff12","section":"f","limit":60,"opts":[["dial",0,4],["dial",6,2],["dial",2,4],["dial",6,4]],"correct":3},{"prompt":"按图折成立方体，初始 K 朝上、H 正对你。先向右滚 90°，再向你滚 90°；不额外转向。最终朝上、正对你的面依次是什么？","cols":1,"frames":[["net","GHIJKL"]],"why":"初始上 K、前 H、后 J、左 G、右 I、下 L。向右后，上变 G，前后仍是 H、J；再向你滚时，原后面 J 来到上方，原上面 G 来到前方，所以是 J、G。每滚一次只更新受影响的位置，避免从头重建六面。","id":"Ff13","section":"f","limit":75,"opts":["J、G","G、K","J、I","L、G"],"correct":0},{"prompt":"骨牌左右两端分别运算。根据前两行补全第三行。","cols":3,"frames":[["dom",2,6],["dom",1,2],["dom",3,4],["dom",1,1],["dom",3,4],["dom",4,3],["dom",2,5],["dom",3,3],null],"why":"左端是前两张之和，右端是前两张之差的绝对值。末行左端 2＋3＝5，右端 |5−3|＝2。先用第一行提出规则，再用第二行验证右端不能是有正负的直接相减。","id":"Ff14","section":"f","limit":60,"opts":[["dom",1,2],["dom",5,6],["dom",5,2],["dom",2,5]],"correct":2},{"prompt":"每行右图的柱高由前两图同一位置比较得出，补全最后一组。","cols":3,"frames":[["bars",[2,3,1]],["bars",[3,1,2]],["bars",[2,1,1]],["bars",[3,2,2]],["bars",[1,3,1]],["bars",[1,2,1]],["bars",[2,1,3]],["bars",[3,2,2]],null],"why":"每根柱子取前两图同位置中较矮的一根。末行是 min(2,3)、min(1,2)、min(3,2)，得到 2、1、2。先比较最左柱排除一部分选项，再核对另外两柱，不要只看总高。","id":"Ff15","section":"f","limit":60,"opts":[["bars",[1,1,2]],["bars",[3,2,3]],["bars",[2,2,2]],["bars",[2,1,2]]],"correct":3},{"prompt":"4×4 方格纸先将右半向左对折，再将下半向上对折。图示折好后的 2×2 纸层，黑格处打穿所有层。展开后孔在哪里？","cols":1,"frames":[["grid",2,"3"]],"why":"按相反顺序撤销折叠。折后右下孔先沿上下折痕镜像，落到原纸第 2、3 行；再撤销左右折叠，落到第 2、3 列。因此四孔组成原纸中心的 2×2。先定行、再定列，避免一边展开一边随意平移孔。","id":"Ff16","section":"f","limit":75,"opts":[["grid",4,"5,6,9,10"],["grid",4,"1,2,13,14"],["grid",4,"5,6,13,14"],["grid",4,"0,3,12,15"]],"correct":0},{"prompt":"沿同一列向下观察，每次图案都作相同旋转。补全右下图。","cols":3,"frames":[["grid",3,"01"],["grid",3,"03"],["grid",3,"05"],["grid",3,"25"],["grid",3,"12"],["grid",3,"27"],["grid",3,"78"],["grid",3,"58"],null],"why":"每列向下都是顺时针转 90°。第三列第一图左上＋中右，变成右上＋下中；再转一次，右上到右下、下中到中左，故末图是中左＋右下。先只追第三列的一个格，确定方向后再核对另一格。","id":"Ff17","section":"f","limit":60,"opts":[["grid",3,"05"],["grid",3,"16"],["grid",3,"38"],["grid",3,"27"]],"correct":2},{"prompt":"各位置的颜色按同一固定顺序循环变化。接下来是哪一幅？","cols":4,"frames":[["shade",2,[0,1,2,0]],["shade",2,[1,2,0,1]],["shade",2,[2,0,1,2]],null],"why":"每个格独立按白→灰→黑→白循环。下一幅从左上按行是白、灰、黑、白，回到第一幅。只看一个位置确定三状态循环，再核对其他位置；不是整张图旋转，也不是所有格同时取同一种颜色。","id":"Ff18","section":"f","limit":60,"opts":[["shade",2,[0,2,1,0]],["shade",2,[0,1,2,0]],["shade",2,[2,1,0,2]],["shade",2,[1,2,0,1]]],"correct":1},{"prompt":"将这张展开图折成立方体，哪组三个面能在同一个顶点相遇？","cols":1,"frames":[["net","KLMNPQ"]],"why":"横排隔一面的 K/M、L/N 分别相对，上下盖 P/Q 相对。同一顶点不能包含一对相对面。逐项检查后，只有 K、L、Q 没有相对面。先列三对对面，通常比直接想象三维顶点快。","id":"Ff19","section":"f","limit":75,"opts":["K、M、P","L、N、Q","K、P、Q","K、L、Q"],"correct":3},{"prompt":"上方两图绕中心旋转 180° 后都与原图重合。哪一项也满足？只考虑黑格图案。","cols":2,"frames":[["grid",3,"03458"],["grid",3,"12467"]],"why":"旋转 180° 时，左上与右下、上中与下中、中左与中右、右上与左下分别成对，中心不动。左上、上中、中心、下中、右下的选项逐对齐全，故满足。它不必有一条镜面对称轴；中心对称与轴对称是两个独立检查。","id":"Ff20","section":"f","limit":60,"opts":[["grid",3,"01248"],["grid",3,"01348"],["grid",3,"01478"],["grid",3,"02348"]],"correct":2}]},"m-a":[{"title":"按期上线，还是缩小承诺？","context":"你接手一个预约服务，两周后必须向首批门店交付。合同要求预约与取消都能使用，营销页另宣传了智能推荐，但尚未写入合同。剩余人力 12 人日：预约收尾需 4 人日，取消和异常退款需 5 人日，稳定性验证需 3 人日，智能推荐需 5 人日。销售已口头答应两家大店会上推荐。研发提出压缩验证，客服担心首发投诉。","prompt":"作为负责人，你今天怎样定范围？写清保留和推迟什么、如何处理两家大店的预期，以及上线或暂缓的判断条件。","criteria":[["范围与算账","说明 4＋5＋3 正好占用 12 人日。若保推荐，给出可信的新增人力、延后时间或替换范围，说明谁承担代价。"],["利益相关方","区分合同义务、真实的口头承诺与宣传，亲自协调销售和客户，明确过渡安排。"],["交付责任","写清产品、研发、客服各自要产出什么，以及何时集成联测。"],["放行与止损","提出可检查的放行条件、监测与回退办法；允许关键链路未达标时延期或缩小首发。"]],"sample":"今天确认首发交付预约、取消退款和稳定性验证，分别投入 4、5、3 人日。先把推荐移出首发并修订宣传。今天我和销售一起向两家门店说明原因，逐家核对推荐是否影响其开业计划，可先给人工精选清单，三天内回复正式排期。研发分两段打通预约和取消退款，客服参与异常单演练。发布前逐项核验付款、取消、到账和告警，任一资金链路失败就暂缓。先选愿意试用的一家门店灰度，我负责看异常及客诉，再决定扩面。","miss":"只说“协调大家加快”会留下 5 人日缺口；只说按合同办，也漏掉了销售已经建立的客户预期。","id":"Am01"},{"title":"两支团队为何都在等对方？","context":"你负责改善首次交付。最近一个月，20 个受阻订单中有 12 个缺安装参数、5 个遇到旧设备兼容问题、3 个因客户现场未就绪。销售填表只需 3 分钟，补齐参数估计要再多 6 分钟；交付团队每个缺参单平均多花 50 分钟追问。销售负责人担心客户在签单前流失，两位负责人已经在群里互相指责。你有两周做一次小范围改进。","prompt":"请给出你前 48 小时的处理方式、两周内的试验和判断是否推广的依据。说明遇到客户说不清参数时怎么办。","criteria":[["定位与限度","优先看 12 个缺参案例，辨认谁能提供资料；说明只统计了受阻单，不能由 12/20 推断所有订单的缺参率。"],["化解冲突","分别听双方顾虑，随后共同核对实际订单，明确交接点及异常负责人。"],["低成本验证","区分签约必填与安装前补齐，给说不清的客户留出照片、技术回访等替代路径。"],["推广标准","同时观察首次成功率或补参工时，以及签约流失、客户负担；按可比客户和相同窗口复核。"]],"sample":"我先请双方停止群里归责，今天分别看各自遇到的真实订单，再一起重走三笔缺参流程。12 笔来自受阻样本，先补全同期总订单和签约流失基线。明天选一组类似客户试行：签约时只确认设备型号和现场联系人，安装前由交付专员补齐参数；客户说不清就约技术回电或拍铭牌。销售负责取得联系许可，交付负责次日核实。两周后对比试点与相近原流程客户的首次交付成功率、追问工时、签约率及投诉。若交付改善且签约无明显损失再扩；若签约恶化就后移非必要字段。","miss":"把所有字段前置给销售，可能把交付成本转成客户流失；只强调开会也不能检验流程是否变好。","id":"Am02"}],"m-b":[{"title":"增长达标，是否扩大试点？","context":"你负责订阅服务的新优惠。两个可比地区同期试行，试点每千名访客新增 110 笔订单，对照为 100 笔。每单实收同为 100 元。试点首周退款率 8%，对照 3%；退款常在第 14 天才结清，目前只看到第 7 天。试点每千访客还多花 600 元服务成本。渠道希望明天全面推广，两家重点客户反馈误购较多。","prompt":"请向业务负责人提交明日决定，说明你如何使用已有数字、如何处理客户信号，以及何时、依据什么放量或回滚。","criteria":[["算清账","按当前退款估算：试点 10,120 元，对照 9,700 元；差额 420 元，小于 600 元新增服务成本。相对贡献暂少 180 元。"],["界定未知","第 7 天退款还会变化；两家反馈提示风险，但样本不足以推断全部。写清同龄批次、同类客户和完整观察窗。"],["明日动作","给出继续、缩量或暂停的具体范围；对风险客户有即时保护，明确负责人与取证动作。"],["决策门槛","同时看完整观察期的单位贡献和客户指标。写明检查日期、扩面或停止条件及谁决定。"]],"sample":"明天先不扩。按每千访客计，首周试点扣退款后收入 10,120 元，对照 9,700 元，增加 420 元，尚盖不住多出的 600 元服务成本。我今天请渠道逐单核对两家客户的误购原因，暂停风险入口并提供纠错退款；其他低风险流量维持小规模和对照。数据负责人跟踪同批次至第 14 天，按渠道分层复核净贡献、误购率和客诉。若完整窗口中单位贡献稳定转正、重点客户误购没有恶化，再分批扩面；负贡献持续就回滚。若中途发现明确的误导展示，立即停掉相关入口，由我通知渠道与客户。","miss":"只引用订单增加 10% 会忽略退款与成本；只说等一周则漏掉了两家客户今天就需要的保护。","id":"Bm01"},{"title":"让骨干继续救火，还是让新人接手？","context":"团队每周有 10 次设备交付。一名骨干独立负责 8 次，另两名同事目前能完成常规操作。过去四周出现 3 次异常，均由骨干补救。骨干两周后起休假 10 天，下一周还有一次高价值客户迁移，失败会造成停用。骨干表示“我演示一遍最快”，新人表示“没有实际操作，很难独立判断”。你不能增加人手。","prompt":"请说明高价值迁移由谁负责、两周内怎样交接、如何验证新人能独立工作，以及交接未达标时怎样守住交付。","criteria":[["风险分层","区别常规单与高价值迁移。讲明执行、复核、最终决策各由谁承担，安排与现有人员能力匹配。"],["培养方法","设计影子观察、反向演练或分级授权，让新人实际操作异常；把骨干的判断和回滚条件留下来。"],["可验收标准","给出可观察的独立通过条件，例如异常识别、停手、回退、通知客户，指定检查时间。"],["兜底与沟通","预先保留变更窗口、回滚或延期方案，告知客户及接手人；避免把休假骨干当作唯一后备。"]],"sample":"下周的高价值迁移由骨干把关，一名新人按演练过的步骤操作，我决定放行或回退，另一名新人负责监测和客户通报。今天先把 3 起异常还原成演练，标出识别信号、停手机制和恢复步骤。第一周常规单由新人轮流主操，骨干旁听；第二周骨干退出操作，由两人互为复核并独立演练一次故障。验收要求能识别错配、在约定时限内回退并准确告知影响。我在休假前三天检查结果；未通过就拆分高风险批次、与客户重约窗口，休假期间只承接已验证范围。","miss":"写一份手册或演示一次，无法证明新人遇到异常时会停手；所有决定仍等骨干远程确认，也没有解决单点依赖。","id":"Bm02"}]};</script><script>'use strict';
const app = document.getElementById('app');
const sections = {v:'言语理解', d:'数据分析', f:'图形推理'};
const titles = {'c-a':'基础与节奏','c-b':'比较与推断','c-c':'组合与边界','c-d':'进阶与辨析','c-e':'错题集中回顾','c-f':'错题再练 · 图形与数据','m-a':'交付与协作','m-b':'经营与带队'};
const prefix = 'weekend-workbook.v1:';
const memory = new Map();
const tabId = typeof crypto !== 'undefined' && crypto.randomUUID ? crypto.randomUUID() : String(Math.random());
let storeOK = true;
let current = null;
let running = false;
let lastTick = 0;
let lastSaved = 0;
let pendingStart = '';
let filterErrors = false;
let flash = '';
let composing = false;
let visibleRoute = '';
let lastActive = null;
const letters = 'ABCD';
// Review annotations are independent of answer records and survive a run reset.
const markPrefix = 'weekend-workbook.marks.v1:';
const slowFraction = 0.8;
let exportOmissions = new Set();
function isMarked(id){return read(markPrefix+id)?.selected===true;}
function markButton(id){return '<button type="button" class="btn mark-btn" data-mark="'+id+'" aria-pressed="'+isMarked(id)+'">'+(isMarked(id)?'★ 已标记加练':'☆ 标记加练')+'</button>';}
function toggleMark(id){
  if(!Object.keys(BANK).filter(b=>b[0]==='c').some(b=>itemsFor(b,'all').some(q=>q.id===id)))return;
  const selected=!isMarked(id);
  if(selected)write(markPrefix+id,{selected:true,touched:Date.now()});else remove(markPrefix+id);
  app.querySelectorAll('[data-mark]').forEach(b=>{if(b.dataset.mark===id){b.setAttribute('aria-pressed',String(selected));b.textContent=selected?'★ 已标记加练':'☆ 标记加练';}});
}
function recordSpent(ms){
  if(current.book[0]!=='c'||ms<=0)return;
  const q=itemsFor(current.book,current.mode)[current.pos];
  current.spent ||= {};current.timingComplete ||= {};
  if(!Object.hasOwn(current.spent,q.id)){
    current.spent[q.id]=0;
    current.timingComplete[q.id]=Math.abs(current.item-q.limit*1000)<0.5;
  }
  current.spent[q.id]+=ms;
}
function attemptInfo(s,q,index){
  const raw=s.answers?.[q.id],answer=Number.isInteger(raw)&&raw>=0&&raw<4?raw:null;
  const elapsed=Number.isFinite(s.spent?.[q.id])&&s.spent[q.id]>=0?s.spent[q.id]:null;
  const flags=[];
  if(answer===null)flags.push('未答');else if(answer!==q.correct)flags.push('错题');
  if(s.expired?.[q.id])flags.push('单题到时');
  if(s.totalExpiredId===q.id || (!s.totalExpiredId&&s.done&&/整场时间到|总时间结束/.test(s.reason||'')&&index===s.pos))flags.push('整场到时');
  if(elapsed!==null&&elapsed>=q.limit*1000*slowFraction)flags.push('耗时较长');
  return {mode:s.mode,modeLabel:modeLabel(s.book,s.mode),answerIndex:answer,answerLetter:answer===null?'未答':letters[answer],correct:answer===q.correct,flags,elapsedMs:elapsed,timingComplete:elapsed!==null&&s.timingComplete?.[q.id]===true,limitSeconds:q.limit};
}
function timingText(a){
  if(a.elapsedMs===null)return '单题用时未记录';
  return (a.timingComplete?'用时 ':'已记录用时至少 ')+Math.round(a.elapsedMs/1000)+' 秒'+(a.timingComplete?'':'（从更新后续答开始）');
}
function collectReview(){
  const items=[];let pending=0;
  for(const book of Object.keys(BANK).filter(b=>b[0]==='c')){
    const records=modesFor(book).map(mode=>read(keyOf(book,mode))).filter(s=>s?.done);
    for(const q of itemsFor(book,'all')){
      const attempts=[];
      for(const s of records){
        const index=itemsFor(book,s.mode).findIndex(x=>x.id===q.id);
        if(index>=0)attempts.push(attemptInfo(s,q,index));
      }
      const marked=isMarked(q.id), reasons=[...new Set(attempts.flatMap(a=>a.flags))];
      if(marked&&!attempts.length)pending++;
      if(marked)reasons.push('手动加练');
      if(attempts.length&&reasons.length)items.push({id:q.id,book,bookLabel:displayBook(book),section:sections[q.section],question:q,marked,reasons,attempts});
    }
  }
  return {items,pending};
}
function exportEntry(){
  const {items}=collectReview();
  return '<section class="panel export-entry"><div><h2>错题与加练</h2><p class="help">自动汇总已交卷认知练习，也收录你标记的题。'+(items.length?'当前有 '+items.length+' 道可导出。':'交卷后即可使用。')+'</p></div><a class="pbtn" href="#export">导出错题与加练</a></section>';
}
function renderExport(){
  const {items,pending}=collectReview();
